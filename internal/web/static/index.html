<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>homebase</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="dot" id="overall" data-state="pending"></span>
      <h1>homebase</h1>
      <span class="host muted" id="host"></span>
    </div>
    <div class="summary" id="summary">Loading…</div>
  </header>

  <main>
    <div id="error" class="banner" hidden></div>

    <section id="machine" class="machine" hidden aria-label="This PC's CPU and memory">
      <div class="meters">
        <div class="meter">
          <div class="meter-head"><span class="meter-label">CPU</span><span class="meter-value" id="cpu-value">–</span></div>
          <svg class="spark" id="cpu-spark" viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="CPU, last 5 minutes">
            <path class="spark-area"></path><polyline class="spark-line"></polyline>
          </svg>
          <div class="meter-sub muted" id="cpu-sub"></div>
        </div>
        <div class="meter">
          <div class="meter-head"><span class="meter-label">Memory</span><span class="meter-value" id="mem-value">–</span></div>
          <svg class="spark" id="mem-spark" viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="Memory, last 5 minutes">
            <path class="spark-area"></path><polyline class="spark-line"></polyline>
          </svg>
          <div class="meter-sub muted" id="mem-sub"></div>
        </div>
      </div>
      <table class="usage">
        <thead><tr><th>By app</th><th>CPU</th><th>Memory</th><th class="share-col">Share of RAM</th></tr></thead>
        <tbody id="usage-rows"></tbody>
      </table>
    </section>

    <section id="apps" class="grid" aria-live="polite"></section>

    <section id="logs" class="logs" hidden>
      <div class="logs-head">
        <h2 id="logs-title">Logs</h2>
        <label class="follow"><input type="checkbox" id="follow" checked> Follow</label>
        <button type="button" id="logs-close" class="ghost">Close</button>
      </div>
      <pre id="logs-body" tabindex="0"></pre>
    </section>
  </main>

  <template id="card">
    <article class="card">
      <header>
        <span class="dot"></span>
        <div class="titles">
          <h2></h2>
          <a class="link" target="_blank" rel="noopener noreferrer"></a>
        </div>
        <span class="state"></span>
      </header>
      <p class="message" hidden></p>
      <dl class="facts"></dl>
      <div class="actions">
        <button type="button" data-action="start">Start</button>
        <button type="button" data-action="restart">Restart</button>
        <button type="button" data-action="stop" class="danger">Stop</button>
        <button type="button" data-logs class="ghost">Logs</button>
      </div>
    </article>
  </template>
</body>
</html>
