<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat · homebase</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="monitor.css">
  <script src="chat.js" defer></script>
  <script src="monitor.js" defer></script>
</head>
<body class="chat-page">
  <header class="bar">
    <div class="brand">
      <a href="./" class="back" title="Back to the dashboard">homebase</a>
      <span class="muted">/</span>
      <h1>Chat</h1>
    </div>
    <div class="chat-tools">
      <a class="chat-link" href="ai.html">Models &amp; setup</a>
      <select id="model" aria-label="Model"></select>
      <button type="button" id="new">New chat</button>
    </div>
  </header>
  <div id="monitor" class="hb-strip" hidden aria-label="The PC's load"></div>

  <main class="chat-main">
    <div id="error" class="banner" hidden></div>
    <section id="transcript" class="transcript" aria-live="polite">
      <div class="empty muted" id="empty">
        <p>Chat with the models Ollama runs on this PC's GPU. Nothing leaves your machines.</p>
        <p class="small">Conversations are kept in this browser only. To have the model read and edit your code, use Loom's Local AI view with this PC as its server (<a href="ai.html">how to connect it</a>).</p>
      </div>
    </section>
  </main>

  <form id="composer" class="composer">
    <textarea id="input" rows="3" placeholder="Message the model… (Enter sends, Shift+Enter for a new line)" autocomplete="off"></textarea>
    <div class="composer-foot">
      <span class="muted small" id="status"></span>
      <button type="submit" id="send">Send</button>
    </div>
  </form>
</body>
</html>
