<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · homebase</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="projects.css">
  <script src="projects.js" defer></script>
</head>
<body class="projects-page">
  <header class="bar">
    <div class="brand">
      <a href="./" class="back" title="Back to the dashboard">homebase</a>
      <span class="muted">/</span>
      <h1>Projects</h1>
    </div>
    <label class="live muted small" title="Check for changes every few seconds">
      <input type="checkbox" id="live" checked> Live <span id="updated"></span>
    </label>
  </header>

  <div class="projects-layout">
    <nav class="project-list" aria-label="Projects">
      <ul id="projects"></ul>
    </nav>

    <main class="project-view" id="view">
      <div id="error" class="banner" hidden></div>
      <p class="muted" id="placeholder">Pick a project. The ones changed most recently are at the top.</p>

      <section id="project" hidden>
        <div class="project-head">
          <h2 id="p-name"></h2>
          <span class="branch" id="p-branch"></span>
          <span class="muted small" id="p-commit"></span>
        </div>
        <div class="sync">
          <span class="sync-state" id="sync-state"></span>
          <div class="sync-buttons">
            <button type="button" data-git="fetch" title="Check the remote for new commits (git fetch)">Fetch</button>
            <button type="button" data-git="pull" title="Bring in the remote's new commits (fast-forward only)">Pull</button>
            <button type="button" data-git="push" title="Send this branch's commits to its remote">Push</button>
            <button type="button" id="commit-open" title="Commit every change listed under Changes">Commit…</button>
          </div>
        </div>
        <form id="commit-form" class="commit-form" hidden>
          <label for="commit-message">Commit message</label>
          <textarea id="commit-message" rows="3" placeholder="What changed, e.g. Add tax to order totals"></textarea>
          <p class="small muted" id="commit-note"></p>
          <div class="commit-actions">
            <button type="submit" class="primary" id="commit-go">Commit</button>
            <button type="button" id="commit-cancel">Cancel</button>
          </div>
        </form>
        <div id="result" class="result" hidden>
          <p id="result-text"></p>
          <details id="result-details" hidden><summary>Show git output</summary><pre id="result-output"></pre></details>
        </div>
        <div class="tabs" role="tablist">
          <a role="tab" id="tab-changes" href="#">Changes <span class="count" id="p-count"></span></a>
          <a role="tab" id="tab-files" href="#">Files</a>
        </div>

        <div id="changes" class="changes"></div>

        <div id="files" hidden>
          <nav class="crumbs" id="crumbs" aria-label="Folder"></nav>
          <table class="entries">
            <tbody id="entries"></tbody>
          </table>
          <div id="viewer" class="viewer" hidden>
            <div class="viewer-head">
              <span id="v-path"></span>
              <span class="muted small" id="v-meta"></span>
            </div>
            <p class="muted" id="v-note" hidden></p>
            <pre id="v-text" class="code"></pre>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
